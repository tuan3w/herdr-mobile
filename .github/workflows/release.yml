name: Release

# Tag a version (git tag v0.1.1 && git push origin v0.1.1) to build and
# publish the APK. The release notes are that version's section of
# CHANGELOG.md (`## [0.1.1] - date`); a tag without one fails before building.
#
# Signing needs these repository secrets (see docs/DEVELOPMENT.md, "Android
# release build"):
#   ANDROID_KEYSTORE_BASE64   base64 of release.jks
#   ANDROID_KEYSTORE_PASSWORD store and key password
#   ANDROID_KEY_ALIAS         e.g. herdr-mobile
# Without them the run is skipped with a warning: a debug-signed APK must never
# be published, and a release can still be built and uploaded by hand.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check signing secrets
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Release skipped::Signing secrets are not configured, so nothing was built or published. See README, 'Android release build'."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.sign.outputs.enabled == 'true'

      - uses: actions/setup-java@v5
        if: steps.sign.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        if: steps.sign.outputs.enabled == 'true'
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Verify tag matches pubspec version and has release notes
        if: steps.sign.outputs.enabled == 'true'
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' app/pubspec.yaml)"
          [ "$want" = "$have" ] || { echo "tag $want != pubspec $have"; exit 1; }
          tool/release-notes.sh "$want" > "$RUNNER_TEMP/notes.md"

      # The tests tagged `timing` assert on real time and fail when the CPU is busy (two of them
      # kept the 0.1.37 APK from being published), so they run apart, at half the jobs.
      - name: Analyze and test
        if: steps.sign.outputs.enabled == 'true'
        env:
          HERDR_TEST_ONLY: rest
        run: tool/check.sh

      - name: Test (timing)
        if: steps.sign.outputs.enabled == 'true'
        env:
          HERDR_TEST_ONLY: timing
        run: tool/check.sh --tests

      - name: Restore signing key
        if: steps.sign.outputs.enabled == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > app/android/key.properties

      # --split-debug-info keeps the Dart symbol tables out of libapp.so
      # (11.9 -> 10.1 MiB per ARM flavour, measured on 0.1.11); they are
      # attached to the release as herdr-mobile-X.Y.Z-symbols.zip, which
      # `flutter symbolize` needs to read a crash stack trace from that build.
      - name: Build APKs
        if: steps.sign.outputs.enabled == 'true'
        working-directory: app
        run: flutter build apk --release --target-platform android-arm,android-arm64 --split-debug-info=build/symbols

      - name: Verify signature is not the debug key
        if: steps.sign.outputs.enabled == 'true'
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs app/build/app/outputs/flutter-apk/app-release.apk \
            | tee /tmp/cert.txt
          ! grep -qi "Android Debug" /tmp/cert.txt

      - name: Collect assets
        if: steps.sign.outputs.enabled == 'true'
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir dist
          cp app/build/app/outputs/flutter-apk/app-release.apk "dist/herdr-mobile-$v.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS)
          (cd app/build/symbols && zip -q -r "$GITHUB_WORKSPACE/dist/herdr-mobile-$v-symbols.zip" .)

      - name: Publish release
        if: steps.sign.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "herdr mobile $GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi

  # herdr-tui, the desktop client (rust/), per platform. Needs no signing secrets. The binary
  # carries the keeper, so a machine installs one file (tool/install-tui.sh).
  tui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: herdr-tui-linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: herdr-tui-linux-aarch64 }
          # macos-14 is retired: its arm64 runner fails with "configuration not supported".
          - { os: macos-15, target: aarch64-apple-darwin, asset: herdr-tui-macos-arm64 }
          - { os: macos-15-intel, target: x86_64-apple-darwin, asset: herdr-tui-macos-x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust target
        run: |
          rustup toolchain install stable --profile minimal --target "${{ matrix.target }}"
          rustup default stable
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Check and test
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Build
        working-directory: rust
        # syntect's regex engine (oniguruma) is C: `cc` must be told which compiler builds it for
        # a musl target (it only guesses `<arch>-linux-musl-gcc`, which musl-tools does not install).
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked -p herdr-tui --target "${{ matrix.target }}"
      - name: Smoke test
        run: rust/target/${{ matrix.target }}/release/herdr-tui --version
      - name: Stage
        run: |
          mkdir dist
          cp "rust/target/${{ matrix.target }}/release/herdr-tui" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  tui-publish:
    needs: tui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and install script
        run: |
          cp tool/install-tui.sh dist/install.sh
          (cd dist && sha256sum herdr-tui-* > herdr-tui-SHA256SUMS)
          cat dist/herdr-tui-SHA256SUMS
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The APK job may have made the release already, or be skipped (no secrets).
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            tool/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
            gh release create "$GITHUB_REF_NAME" --title "herdr mobile $GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/notes.md" || gh release view "$GITHUB_REF_NAME" >/dev/null
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
