name: Release

# Tag a version (git tag v0.1.1 && git push origin v0.1.1) to build and
# publish the APK and the host helper. The release notes are that version's
# section of CHANGELOG.md (`## [0.1.1] - date`); a tag without one fails
# before building.
#
# The release is made as a draft and published by the last job, once the APK
# and every platform's herdr-host are attached: a published release without
# the helper strands every phone that updates to it. A failed job leaves the
# draft; re-run the failed jobs and the last one publishes it.
#
# Signing needs these repository secrets (see docs/DEVELOPMENT.md, "Android
# release build"):
#   ANDROID_KEYSTORE_BASE64   base64 of release.jks
#   ANDROID_KEYSTORE_PASSWORD store and key password
#   ANDROID_KEY_ALIAS         e.g. herdr-mobile
# Without them no APK is built (a debug-signed APK must never be published),
# so the release stays a draft with the helper attached: upload the APK by
# hand, then `gh release edit vX.Y.Z --draft=false`.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # The tag and the notes are checked, and the release is created as a draft, before anything is
  # built: a tag without a CHANGELOG section fails here in seconds, whatever the signing secrets.
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches pubspec version and has release notes
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' app/pubspec.yaml)"
          [ "$want" = "$have" ] || { echo "tag $want != pubspec $have"; exit 1; }
          tool/release-notes.sh "$want" > "$RUNNER_TEMP/notes.md"

      # The one place a release is created, so the jobs below only attach to it. A re-run of a
      # tag finds its release (draft or published) and only refreshes the notes.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "herdr mobile $GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi

  apk:
    needs: draft
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      enabled: ${{ steps.sign.outputs.enabled }}
    steps:
      - name: Check signing secrets
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=APK skipped::Signing secrets are not configured, so no APK was built and the release stays a draft (with the host helper attached). Upload the APK by hand, then publish it. See docs/DEVELOPMENT.md, 'Android release build'."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.sign.outputs.enabled == 'true'

      - uses: actions/setup-java@v5
        if: steps.sign.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        if: steps.sign.outputs.enabled == 'true'
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Build herdr-host and the test fixtures (what the phone-path tests exec)
        if: steps.sign.outputs.enabled == 'true'
        working-directory: rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo build --release --locked -p host -p testkit

      # The tests tagged `timing` assert on real time and fail when the CPU is busy (two of them
      # kept the 0.1.37 APK from being published), so they run apart, at half the jobs.
      - name: Analyze and test
        if: steps.sign.outputs.enabled == 'true'
        env:
          HERDR_TEST_ONLY: rest
        run: tool/check.sh

      - name: Test (timing)
        if: steps.sign.outputs.enabled == 'true'
        env:
          HERDR_TEST_ONLY: timing
        run: tool/check.sh --tests

      - name: Restore signing key
        if: steps.sign.outputs.enabled == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > app/android/key.properties

      # --split-debug-info keeps the Dart symbol tables out of libapp.so
      # (11.9 -> 10.1 MiB per ARM flavour, measured on 0.1.11); they are
      # attached to the release as herdr-mobile-X.Y.Z-symbols.zip, which
      # `flutter symbolize` needs to read a crash stack trace from that build.
      - name: Build APKs
        if: steps.sign.outputs.enabled == 'true'
        working-directory: app
        run: flutter build apk --release --target-platform android-arm,android-arm64 --split-debug-info=build/symbols

      - name: Verify signature is not the debug key
        if: steps.sign.outputs.enabled == 'true'
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs app/build/app/outputs/flutter-apk/app-release.apk \
            | tee /tmp/cert.txt
          ! grep -qi "Android Debug" /tmp/cert.txt

      - name: Collect assets
        if: steps.sign.outputs.enabled == 'true'
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir dist
          cp app/build/app/outputs/flutter-apk/app-release.apk "dist/herdr-mobile-$v.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS)
          (cd app/build/symbols && zip -q -r "$GITHUB_WORKSPACE/dist/herdr-mobile-$v-symbols.zip" .)

      # The release is a draft until `publish` (below) has every asset: see there for why.
      - name: Attach to the draft release
        if: steps.sign.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  # herdr-tui, the desktop client (rust/), per platform. Needs no signing secrets. The binary
  # carries the keeper, so a machine installs one file (tool/install-tui.sh).
  tui:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: herdr-tui-linux-x86_64, host: herdr-host-linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: herdr-tui-linux-aarch64, host: herdr-host-linux-aarch64 }
          # macos-14 is retired: its arm64 runner fails with "configuration not supported".
          - { os: macos-15, target: aarch64-apple-darwin, asset: herdr-tui-macos-arm64, host: herdr-host-macos-arm64 }
          - { os: macos-15-intel, target: x86_64-apple-darwin, asset: herdr-tui-macos-x86_64, host: herdr-host-macos-x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust target
        run: |
          rustup toolchain install stable --profile minimal --target "${{ matrix.target }}"
          rustup default stable
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Check and test
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Build
        working-directory: rust
        # syntect's regex engine (oniguruma) is C: `cc` must be told which compiler builds it for
        # a musl target (it only guesses `<arch>-linux-musl-gcc`, which musl-tools does not install).
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          cargo build --release --locked -p herdr-tui --target "${{ matrix.target }}"
          cargo build --release --locked -p host --target "${{ matrix.target }}"
      - name: Smoke test
        run: |
          rust/target/${{ matrix.target }}/release/herdr-tui --version
          rust/target/${{ matrix.target }}/release/herdr-host --version
      - name: Stage
        run: |
          mkdir dist
          cp "rust/target/${{ matrix.target }}/release/herdr-tui" "dist/${{ matrix.asset }}"
          cp "rust/target/${{ matrix.target }}/release/herdr-host" "dist/${{ matrix.host }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.host }}

  # Attaches the host helper (and the desktop client) to the draft. It needs every `tui` leg,
  # so one failed platform publishes nothing and leaves the draft for a re-run.
  tui-publish:
    needs: tui
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and install scripts
        run: |
          cp tool/install-tui.sh dist/install.sh
          (cd dist && sha256sum herdr-tui-* > herdr-tui-SHA256SUMS)
          (cd dist && sha256sum herdr-host-* > herdr-host-SHA256SUMS)
          cp tool/install-host.sh dist/install-host.sh
          cat dist/herdr-tui-SHA256SUMS dist/herdr-host-SHA256SUMS
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  # The last step, and only when everything is attached. Why: the app pins its helper to its own
  # version and downloads it from this release, and the in-app update offers whatever is the
  # latest published release, so a published release without the helper (or without the APK)
  # strands every phone that updates to it. A failed job above leaves the draft, never that.
  # Without signing secrets no APK is built, so the draft is left for a by-hand upload.
  publish:
    needs: [apk, tui-publish]
    if: needs.apk.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check every asset is attached
        run: |
          v="${GITHUB_REF_NAME#v}"
          have="$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name')"
          for want in "herdr-mobile-$v.apk" SHA256SUMS "herdr-mobile-$v-symbols.zip" \
            herdr-host-linux-x86_64 herdr-host-linux-aarch64 herdr-host-macos-arm64 herdr-host-macos-x86_64 \
            herdr-host-SHA256SUMS install-host.sh; do
            printf '%s\n' "$have" | grep -qxF "$want" || { echo "::error::the release has no $want"; exit 1; }
          done
      - name: Publish the release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
