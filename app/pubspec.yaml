name: herdr_mobile
description: "Mobile client for herdr: every coding agent across all your machines, in your pocket."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# Android versionCode is the number after '+'. It must only ever increase and
# must stay above 5036: development builds before the public 0.1.0 reached
# 5036, and a lower code is refused as a downgrade by phones that have one.
version: 0.1.7+5044

environment:
  sdk: ^3.13.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions

# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  dartssh2: ^4.1.0
  # sha1 of a session key names its folder in the host inbox (host_inbox.dart)
  crypto: ^3.0.7
  pinenacl: ^0.6.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  # The app's private directory for the transcript cache
  # (data/services/transcript_cache.dart): a transcript may hold secrets.
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  # connectivity_plus 7 and flutter_local_notifications 22 cannot resolve
  # together: only through Linux-only transitive packages (dbus 0.8 vs 0.7),
  # which this Android app never builds. Keep connectivity_plus on 6 until
  # the plugin allows dbus 0.8.
  connectivity_plus: ^6.1.4
  flutter_local_notifications: ^22.3.1
  url_launcher: ^6.3.3
  lucide_icons_flutter: ^3.1.21
  # Dictation into the composers (data/services/dictation.dart): Android's own
  # speech recognizer, one language per listen. Nothing outside that file
  # imports it.
  speech_to_text: ^7.5.0
  # Pure-Dart CommonMark/GFM parser behind the MdDocument seam
  # (ui/core/markdown/md_parser.dart); chosen by the bench-off in
  # tool/md-bench. Nothing outside ui/core/markdown/ imports it.
  markdown: ^7.3.1
  # Grapheme-cluster boundaries for the reveal pacer
  # (data/streaming/reveal_pacer.dart); already in the SDK's tree.
  characters: ^1.4.1
  # JPEG encoder for attached photos (data/services/image_prep.dart): dart:ui
  # decodes and downscales but cannot encode JPEG. Pure Dart, run in an
  # isolate; it was already in the tree for the launcher icon tool.
  image: ^4.10.1
  image_picker: ^1.2.3
  share_plus: ^13.3.1
  gal: ^2.3.3
  # The attach sheet's Gallery tab (data/services/phone_gallery.dart): MediaStore
  # paging, albums, its own thumbnail cache, Android 13 granular and Android
  # 14 partial ("selected photos") access. Nothing outside that file and
  # ui/features/attach imports it.
  photo_manager: ^3.12.0
  # The attach sheet's Files tab (data/services/phone_files.dart): the system
  # document picker, multi-select; the plugin streams each document into the
  # app's cache, so nothing large passes through Dart memory.
  file_picker: ^13.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  fake_async: ^1.3.3
  url_launcher_platform_interface: ^2.3.2
flutter:

  # Material widgets (TextField, Tooltip, SnackBar, sheets) are used for their
  # behaviour, but never the Material icon font: icons are Lucide. Kept on
  # because some framework widgets reference MaterialIcons internally; release
  # builds tree-shake the font to the glyphs actually used.
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-Italic.ttf
          style: italic
        - asset: assets/fonts/JetBrainsMono-BoldItalic.ttf
          weight: 700
          style: italic

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# The source PNGs and the notification icon are rendered from
# lib/ui/core/brand_mark.dart by screenshot_test/brand_assets_test.dart (see
# its header); this cuts the platform sizes. The background is Ds.ink.bg. No
# foreground inset: the mark already sits inside the adaptive safe circle.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#0D0E10"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#0D0E10"
    theme_color: "#0D0E10"
